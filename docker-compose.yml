services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    user: "${UID:?Set UID in .env}:${GID:?Set GID in .env}"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:${PORT:-3000}"
    volumes:
      - ./data:/app/data
    healthcheck:
      # node:20-slim には wget が無いため Node の fetch で healthz を叩く
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
